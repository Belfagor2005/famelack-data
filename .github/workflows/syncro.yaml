name: Sincronizza con upstream mantenendo le mie modifiche

on:
  schedule:
    - cron: '0 3 * * 1'   # Lunedì alle 3 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Aggiungi upstream
        run: |
          git remote add upstream https://github.com/famelack/famelack-data.git
          git fetch upstream

      - name: Salva le tue modifiche in un branch temporaneo
        run: |
          git checkout main
          git branch -f mie-modifiche-temp HEAD

      - name: Allinea main con upstream
        run: git reset --hard upstream/main

      - name: Ripristina i file che hai modificato (preservando le tue modifiche)
        run: |
          git diff --name-only mie-modifiche-temp upstream/main | while read file; do
            if [ -n "$file" ]; then
              git checkout mie-modifiche-temp -- "$file"
            fi
          done

      - name: Committa se ci sono cambiamenti
        run: |
          if ! git diff --quiet; then
            git commit -m "Auto-sync: ripristino modifiche locali dopo aggiornamento upstream"
          else
            echo "Nessuna modifica locale da ripristinare"
          fi

      - name: Push sul tuo fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force origin main
