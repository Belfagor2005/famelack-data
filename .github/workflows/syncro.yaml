name: Sync fork with upstream (preserve my changes)

on:
  schedule:
    - cron: '0 3 * * 5'   # ogni venerdì alle 3 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tuo fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aggiungi upstream (repo originale)
        run: git remote add upstream https://github.com/famelack/famelack-data.git

      - name: Fetch degli ultimi aggiornamenti dall'upstream
        run: git fetch upstream

      - name: Checkout del tuo fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Push sul tuo fork
        run: git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/OwnerPlugins/famelack-data.git main
