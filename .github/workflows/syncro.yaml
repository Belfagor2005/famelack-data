name: Sync fork with upstream (preserve my changes)

on:
  schedule:
    - cron: '0 3 * * 5'   # ogni venerdì alle 3 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del tuo fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Aggiungi upstream (repo originale)
        run: git remote add upstream https://github.com/famelack/famelack-data.git

      - name: Fetch degli ultimi aggiornamenti dall'upstream
        run: git fetch upstream

      - name: Merge con priorità alle nostre modifiche
        run: |
          git checkout main
          git merge upstream/main -X ours --no-edit
          # -X ours significa: in caso di conflitto, tieni la MIA versione (le tue modifiche)

      - name: Push sul tuo fork
        run: git push origin main
